    footer = "© 2026 KenoBlog - Kenolab place for sharing and research"
    googleSearch = ""
    googleAnalytics = ""
    adsense = ""

    math = false
    mermaid = false

    facebook = ""
    twitter = "https://x.com/kenolab_fr"
    youtube = ""
    instagram = ""
    github = "https://github.com/KenoLab"
    pinterest = ""
    linkedin = "https://www.linkedin.com/company/kenolab"

